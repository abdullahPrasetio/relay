name: Build

# Cross-platform build: every push produces macOS, Windows, and Linux artifacts.
# A v* tag additionally publishes them in a GitHub Release.
#
# Signing and notarization are OPTIONAL and driven entirely by repository
# secrets. With no secrets configured the workflow still succeeds and uploads
# unsigned artifacts (see "Unsigned builds" below).
#
# Secrets to configure (Settings -> Secrets and variables -> Actions):
#   CSC_LINK                       base64 or URL of the macOS Developer ID .p12
#   CSC_KEY_PASSWORD               password for that .p12
#   WIN_CSC_LINK                   base64 or URL of the Windows code-signing .pfx
#   WIN_CSC_KEY_PASSWORD           password for that .pfx
#   APPLE_ID                       Apple Developer account email
#   APPLE_APP_SPECIFIC_PASSWORD    app-specific password for notarization
#   APPLE_TEAM_ID                  Apple Developer Team ID
#
# When a secret is absent:
#   - no CSC_LINK/WIN_CSC_LINK: that platform's artifacts are produced unsigned;
#     identity auto-discovery stays off.
#   - no APPLE_*: electron-builder skips notarization; the mac build is signed
#     (if CSC_LINK exists) but Gatekeeper will warn on first launch.
#   - unsigned macOS builds CANNOT auto-update: Squirrel.Mac refuses to install
#     an update over an unsigned app. See RELEASING.md.
#
# The build step uses `--publish never`, so CI never needs a GitHub token; the
# tag job below attaches the artifacts with `gh release create`. Update
# metadata (`latest*.yml`) is produced only by `--publish always`, i.e. by a
# local `npm run release`. See RELEASING.md.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never cancel an in-flight release build; branch builds can supersede.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: relay-macos-arm64
            command: npm run dist
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
          - os: windows-latest
            artifact: relay-windows-x64
            command: npm run dist:win
            files: |
              release/*.exe
              release/*.zip
              release/*.blockmap
          - os: ubuntu-latest
            artifact: relay-linux-x64
            command: npm run dist:linux
            files: |
              release/*.AppImage
              release/*.tar.gz
              release/*.blockmap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: ${{ matrix.command }} -- --publish never
        env:
          # Sign when (and only when) a certificate secret exists. The
          # expression renders 'true'/'false', which electron-builder parses.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' || secrets.WIN_CSC_LINK != '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # electron-builder notarizes automatically when all three are set.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: relay-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found in release/" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Relay ${GITHUB_REF_NAME}" \
            --generate-notes
